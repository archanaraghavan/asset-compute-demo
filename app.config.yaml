application:
  actions: actions
  web: web-src
  runtimeManifest:
    packages:
      acworker-superclean:
        license: Apache-2.0
        actions:
          worker:
            function: actions/worker/index.js
            web: 'yes'
            runtime: nodejs:22
            inputs:
              LOG_LEVEL: debug
            annotations:
              final: true
